<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Estate — あなたの知の館</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="walk-mode">
  <canvas id="scene"></canvas>

  <div class="hud brand-hud">
    <span class="brand-mark-mini"></span>
    <span class="brand-name">Knowledge Estate</span>
  </div>

  <div class="hud mode-hud">
    <span id="mode-label">Walk Mode</span>
    <span class="mode-keys">WASD移動 / Mouse視点 / 左クリックで設置 / 右クリックで撤去</span>
  </div>

  <div class="crosshair" id="crosshair"></div>

  <div class="hud key-hud">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動</span>
    <span><kbd>Shift</kbd> ダッシュ</span>
    <span><kbd>L-Click</kbd> 基礎を置く</span>
    <span><kbd>R-Click</kbd> 撤去</span>
    <span><kbd>Esc</kbd> 一時停止</span>
  </div>

  <div class="overlay" id="start-overlay">
    <div class="overlay-card">
      <span class="eyebrow">Welcome to your estate</span>
      <h1>Knowledge Estate</h1>
      <p>あなたの「知の館」へようこそ。<br/>一人称視点で歩き回り、グリッドの上に部屋の基礎を置いていきましょう。</p>
      <ul class="control-list">
        <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動</li>
        <li><kbd>Mouse</kbd> 視点</li>
        <li><kbd>Shift</kbd> ダッシュ</li>
        <li><kbd>Click</kbd> 基礎を置く</li>
      </ul>
      <button class="primary-btn lg" id="start-btn">館に入る</button>
    </div>
  </div>

  <div class="overlay subtle" id="pause-overlay" hidden>
    <div class="overlay-card sm">
      <h2>一時停止</h2>
      <p>クリックすると歩行を再開します。</p>
      <button class="primary-btn" id="resume-btn">再開</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
