<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KNOWLEDGE ESTATE</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-inner">
      <span class="app-logo">KE</span>
      <h1 class="app-title">KNOWLEDGE ESTATE</h1>
      <!-- AI建築士 -->
      <button class="btn-ai" id="aiAddBtn" aria-label="AI建築士でテキストを分析">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        </svg>
        <span>AI</span>
      </button>
      <!-- 今日の復習フィルター -->
      <button class="btn-icon filter-btn" id="filterDueBtn" aria-label="今日の復習のみ表示">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/>
        </svg>
        <span class="filter-badge" id="filterBadge" hidden>0</span>
      </button>
      <!-- 手動追加 -->
      <button class="btn-icon" id="addSeedBtn" aria-label="知識の種を追加">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== ROOM ===== -->
  <main class="room" id="room">
    <div class="room-floor"></div>

    <!-- Live2D キャラクター予約エリア -->
    <div class="live2d-placeholder" aria-hidden="true"><span>Character</span></div>

    <!-- キャラクター吹き出し -->
    <div class="char-bubble" id="characterBubble"></div>

    <div class="seeds-container" id="seedsContainer"></div>

    <div class="empty-state" id="emptyState" hidden>
      <p class="empty-icon">🌱</p>
      <p class="empty-text">部屋に知識の種を<br>配置しましょう</p>
      <button class="btn-primary" id="emptyAddBtn">最初の種を置く</button>
    </div>
  </main>

  <!-- ===== STATS BAR ===== -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-value" id="statTotal">0</span>
      <span class="stat-label">知識の種</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-value stat-value--due" id="statDue">0</span>
      <span class="stat-label">今日の復習</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-value" id="statLearned">0</span>
      <span class="stat-label">学習済み</span>
    </div>
  </div>

  <!-- ===== SEED MODAL ===== -->
  <div class="modal-overlay" id="seedModal" hidden aria-modal="true" role="dialog">
    <div class="modal-card" id="modalCard">

      <div class="modal-header">
        <button class="btn-icon modal-close" id="modalClose" aria-label="閉じる">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <div class="modal-emoji-picker" id="emojiPicker">
          <button class="emoji-current" id="emojiBtn" aria-label="アイコンを変更">
            <span id="currentEmoji">📚</span>
          </button>
          <div class="emoji-grid" id="emojiGrid" hidden></div>
        </div>
        <div class="modal-title-wrap">
          <input class="modal-title-input" id="modalTitle" type="text" placeholder="タイトルを入力..." maxlength="60" />
        </div>
      </div>

      <div class="modal-body">
        <textarea class="modal-memo" id="modalMemo" placeholder="ここにメモを書いてください...&#10;&#10;• 重要なポイント&#10;• 気づき&#10;• 次のアクション" rows="5"></textarea>
      </div>

      <!-- SM-2 Review Panel -->
      <div class="review-panel">
        <div class="review-meta">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/>
          </svg>
          <span id="reviewMetaText">次回の復習: 未設定</span>
        </div>
        <p class="review-prompt">理解度を評価して復習スケジュールを更新</p>
        <div class="review-btns">
          <button class="review-btn review-btn--again"   data-quality="1" type="button"><span class="review-btn-label">もう一度</span><span class="review-btn-sub">─</span></button>
          <button class="review-btn review-btn--hard"    data-quality="2" type="button"><span class="review-btn-label">難しい</span><span class="review-btn-sub">─</span></button>
          <button class="review-btn review-btn--good"    data-quality="4" type="button"><span class="review-btn-label">覚えた</span><span class="review-btn-sub">─</span></button>
          <button class="review-btn review-btn--perfect" data-quality="5" type="button"><span class="review-btn-label">完璧</span><span class="review-btn-sub">─</span></button>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-ghost btn-danger" id="modalDelete">削除</button>
        <button class="btn-primary" id="modalSave">メモを保存</button>
      </div>

    </div>
  </div>

  <!-- ===== ADD SEED MODAL ===== -->
  <div class="modal-overlay" id="addModal" hidden aria-modal="true" role="dialog">
    <div class="modal-card modal-card--sm">
      <div class="modal-header">
        <button class="btn-icon modal-close" id="addModalClose" aria-label="閉じる">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <h2 class="modal-heading">新しい知識の種</h2>
      </div>
      <div class="modal-body">
        <input class="field-input" id="addTitle" type="text" placeholder="タイトル（例: 認知バイアス）" maxlength="60" />
        <div class="category-chips" id="categoryChips"></div>
      </div>
      <div class="modal-footer modal-footer--end">
        <button class="btn-primary" id="addConfirmBtn">配置する</button>
      </div>
    </div>
  </div>

  <!-- ===== AI 建築士 MODAL ===== -->
  <div class="modal-overlay" id="aiModal" hidden aria-modal="true" role="dialog">
    <div class="modal-card modal-card--ai">

      <!-- Step 1: テキスト入力 -->
      <div id="aiStep1">
        <div class="modal-header">
          <button class="btn-icon modal-close" id="aiModalClose" aria-label="閉じる">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
          <div class="ai-modal-heading">
            <span class="ai-badge">AI</span>
            <h2 class="modal-heading">AI建築士</h2>
          </div>
        </div>
        <div class="modal-body">
          <p class="ai-hint">YouTube要約・読書メモ・記事などをペーストすると<br>AIが自動でタイトル・絵文字・重要ポイントを抽出します</p>
          <textarea class="ai-textarea" id="aiInput" placeholder="テキストをここに貼り付けてください...&#10;&#10;例）&#10;今日読んだ本のメモ：認知バイアスとは...&#10;YouTubeの要約：効果的な学習法として..."></textarea>
          <div class="ai-textarea-meta">
            <span class="ai-char-count"><span id="aiCharCount">0</span> 文字</span>
            <span class="ai-min-hint">20文字以上</span>
          </div>
        </div>
        <div class="modal-footer modal-footer--end">
          <button class="btn-primary btn-ai-analyze" id="aiAnalyzeBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            </svg>
            AI分析
          </button>
        </div>
      </div>

      <!-- Step 2: 分析中 -->
      <div id="aiStep2" hidden>
        <div class="ai-loading-wrap">
          <div class="ai-spinner-wrap">
            <div class="ai-spinner"></div>
          </div>
          <p class="ai-loading-title">AI建築士が分析中...</p>
          <p class="ai-loading-sub">テキストから知識の種を設計しています</p>
          <div class="ai-loading-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <!-- Step 3: プレビュー -->
      <div id="aiStep3" hidden>
        <div class="modal-header">
          <button class="btn-icon" id="aiBackBtn" aria-label="戻る">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12,19 5,12 12,5"/>
            </svg>
          </button>
          <h2 class="modal-heading">AI分析結果</h2>
        </div>
        <div class="modal-body">
          <div class="ai-preview-card">
            <div class="ai-preview-emoji" id="aiPreviewEmoji" aria-label="抽出された絵文字">📚</div>
            <input class="field-input ai-preview-title" id="aiPreviewTitle" type="text" maxlength="60" placeholder="タイトル" />
          </div>
          <div class="ai-points-section">
            <p class="ai-points-label">📌 重要ポイント</p>
            <ul class="ai-points-list" id="aiPointsList"></ul>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-ghost" id="aiRetryBtn">やり直す</button>
          <button class="btn-primary" id="aiPlaceBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>
            </svg>
            部屋に配置する
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
