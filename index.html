<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KNOWLEDGE ESTATE</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-inner">
      <span class="app-logo">KE</span>
      <h1 class="app-title">KNOWLEDGE ESTATE</h1>
      <button class="btn-icon" id="addSeedBtn" aria-label="知識の種を追加">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== ROOM ===== -->
  <main class="room" id="room">

    <!-- 床の奥行きライン -->
    <div class="room-floor"></div>

    <!-- Live2D キャラクター予約エリア -->
    <div class="live2d-placeholder" aria-hidden="true">
      <span>Character</span>
    </div>

    <!-- 知識の種コンテナ（JS で動的生成） -->
    <div class="seeds-container" id="seedsContainer"></div>

    <!-- 空状態 -->
    <div class="empty-state" id="emptyState" hidden>
      <p class="empty-icon">🌱</p>
      <p class="empty-text">部屋に知識の種を<br>配置しましょう</p>
      <button class="btn-primary" id="emptyAddBtn">最初の種を置く</button>
    </div>

  </main>

  <!-- ===== STATS BAR ===== -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-value" id="statTotal">0</span>
      <span class="stat-label">知識の種</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-value" id="statReviewed">0</span>
      <span class="stat-label">レビュー済み</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-value" id="statRooms">1</span>
      <span class="stat-label">部屋</span>
    </div>
  </div>

  <!-- ===== SEED MODAL ===== -->
  <div class="modal-overlay" id="seedModal" hidden aria-modal="true" role="dialog">
    <div class="modal-card" id="modalCard">

      <div class="modal-header">
        <button class="btn-icon modal-close" id="modalClose" aria-label="閉じる">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <div class="modal-emoji-picker" id="emojiPicker">
          <button class="emoji-current" id="emojiBtn" aria-label="アイコンを変更">
            <span id="currentEmoji">📚</span>
          </button>
          <div class="emoji-grid" id="emojiGrid" hidden>
            <!-- JS で生成 -->
          </div>
        </div>
        <div class="modal-title-wrap">
          <input class="modal-title-input" id="modalTitle" type="text" placeholder="タイトルを入力..." maxlength="60" />
        </div>
      </div>

      <div class="modal-body">
        <textarea class="modal-memo" id="modalMemo" placeholder="ここにメモを書いてください...&#10;&#10;• 重要なポイント&#10;• 気づき&#10;• 次のアクション" rows="8"></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn-ghost btn-danger" id="modalDelete">削除</button>
        <div class="modal-footer-right">
          <label class="reviewed-toggle">
            <input type="checkbox" id="modalReviewed" />
            <span class="toggle-track"></span>
            <span class="toggle-label">レビュー済み</span>
          </label>
          <button class="btn-primary" id="modalSave">保存</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ===== ADD SEED MODAL ===== -->
  <div class="modal-overlay" id="addModal" hidden aria-modal="true" role="dialog">
    <div class="modal-card modal-card--sm">
      <div class="modal-header">
        <button class="btn-icon modal-close" id="addModalClose" aria-label="閉じる">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <h2 class="modal-heading">新しい知識の種</h2>
      </div>
      <div class="modal-body">
        <input class="field-input" id="addTitle" type="text" placeholder="タイトル（例: 認知バイアス）" maxlength="60" />
        <div class="category-chips" id="categoryChips">
          <!-- JS で生成 -->
        </div>
      </div>
      <div class="modal-footer modal-footer--end">
        <button class="btn-primary" id="addConfirmBtn">配置する</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
